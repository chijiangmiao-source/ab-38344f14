server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Web container's own health endpoint.
    location = /healthz {
        default_type text/plain;
        return 200 'ok\n';
    }

    # API health is proxied through the web container for same-origin checks.
    location = /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }

    # Real API calls are proxied to the api service on the compose network.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
